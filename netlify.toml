[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18.17.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Additional redirects for migrated WordPress posts will be added here
# Format: from = "/old-wordpress-url", to = "/new-astro-path", status = 301
